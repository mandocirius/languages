version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: idiomas_postgres
    environment:
      POSTGRES_DB: idiomas_db
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: idiomas_redis
    ports:
      - "6379:6379"

  livekit:
    image: livekit/livekit-server:v1.6
    container_name: idiomas_livekit
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    volumes:
      - ./docker/livekit.yaml:/etc/livekit.yaml

volumes:
  pgdata:
